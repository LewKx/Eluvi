  <text x="400" y="590" text-anchor="middle" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#1F3D35" letter-spacing="2">peak<tspan fill="#B9855A">Builds</tspan></text>
  <text x="400" y="650" text-anchor="middle" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#2F5D50" letter-spacing="8">NACHHALTIG · WOHNEN · BAUEN</text>
